<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="IPAGothic, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect width="900" height="250" fill="#fff"/>
<text x="450" y="24" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">送るのは符号語だけ。情報語は符号語の中に含まれている</text>
<rect x="20" y="52" width="170" height="120" rx="8" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="105" y="76" font-size="17" fill="#2b8a3e" text-anchor="middle" font-weight="bold" dominant-baseline="middle">情報語</text>
<text x="105" y="98" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">k ビット</text>
<text x="105" y="134" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">1</text>
<text x="105" y="192" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">送りたいデータ</text>
<rect x="250" y="52" width="170" height="120" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="335" y="76" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="bold" dominant-baseline="middle">符号語</text>
<text x="335" y="98" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">n ビット</text>
<text x="335" y="134" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">111</text>
<text x="335" y="192" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">通信路に出すもの</text>
<rect x="480" y="52" width="170" height="120" rx="8" fill="#fff1e6" stroke="#d9480f" stroke-width="1.5"/>
<text x="565" y="76" font-size="17" fill="#d9480f" text-anchor="middle" font-weight="bold" dominant-baseline="middle">受信語</text>
<text x="565" y="98" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">n ビット</text>
<text x="565" y="134" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">101</text>
<text x="565" y="192" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">受信者が受け取るもの</text>
<rect x="710" y="52" width="170" height="120" rx="8" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="795" y="76" font-size="17" fill="#2b8a3e" text-anchor="middle" font-weight="bold" dominant-baseline="middle">情報語</text>
<text x="795" y="98" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">k ビット</text>
<text x="795" y="134" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">1</text>
<text x="795" y="192" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">推定した元のデータ</text>
<line x1="194" y1="112" x2="246" y2="112" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<text x="220.0" y="96" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">符号化</text>
<line x1="424" y1="112" x2="476" y2="112" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<text x="450.0" y="96" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">通信路</text>
<line x1="654" y1="112" x2="706" y2="112" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<text x="680.0" y="96" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">復号</text>
<text x="450" y="140" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal" dominant-baseline="middle">誤りで</text>
<text x="450" y="156" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="normal" dominant-baseline="middle">反転しうる</text>
<text x="450" y="228" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">例: 3 回繰り返し符号（1 節）。誤りが無ければ受信語は送った符号語と同じになる</text></svg>