<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="IPAGothic, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect width="760" height="250" fill="#fff"/>
<text x="380" y="24" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">同じ作り方を 2 回する</text>
<rect x="20" y="32" width="210" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="125" y="58" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">整数 ℤ</text>
<text x="125" y="84" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">…, −1, 0, 1, 2, …</text>
<line x1="240" y1="70" x2="500" y2="70" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<text x="370" y="54" font-size="14" fill="#d9480f" text-anchor="middle" font-weight="bold" dominant-baseline="middle">素数 p で割った余り</text>
<rect x="510" y="32" width="230" height="76" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="625" y="58" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="bold" dominant-baseline="middle">GF(p)</text>
<text x="625" y="84" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">{0, 1, …, p−1}</text>
<rect x="20" y="132" width="210" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="125" y="158" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">多項式 GF(2)[x]</text>
<text x="125" y="184" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">0, 1, x, x+1, x²+1, …</text>
<line x1="240" y1="170" x2="500" y2="170" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<text x="370" y="154" font-size="14" fill="#d9480f" text-anchor="middle" font-weight="bold" dominant-baseline="middle">既約多項式 f で割った余り</text>
<rect x="510" y="132" width="230" height="76" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="625" y="158" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="bold" dominant-baseline="middle">GF(2ᵐ)</text>
<text x="625" y="184" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">次数 m 未満の多項式 2ᵐ 個</text>
<text x="370" y="120" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">（03 章）</text>
<text x="370" y="220" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">（この章）</text></svg>