<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="IPAGothic, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect width="760" height="340" fill="#fff"/>
<text x="380" y="22" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">f = x³ + x + 1 で割った余りの世界 GF(2³)</text>
<text x="170" y="58" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">どんな多項式も f で割った余りに直す</text>
<rect x="20" y="76" width="120" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="80" y="92" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">x³</text>
<line x1="146" y1="92" x2="196" y2="92" stroke="#d9480f" stroke-width="1.5" marker-end="url(#aro)"/>
<rect x="202" y="76" width="130" height="32" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="267" y="92" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">x + 1</text>
<rect x="20" y="120" width="120" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="80" y="136" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">x⁴ + x</text>
<line x1="146" y1="136" x2="196" y2="136" stroke="#d9480f" stroke-width="1.5" marker-end="url(#aro)"/>
<rect x="202" y="120" width="130" height="32" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="267" y="136" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">x²</text>
<rect x="20" y="164" width="120" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="80" y="180" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">x⁵</text>
<line x1="146" y1="180" x2="196" y2="180" stroke="#d9480f" stroke-width="1.5" marker-end="url(#aro)"/>
<rect x="202" y="164" width="130" height="32" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="267" y="180" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">x² + x + 1</text>
<rect x="20" y="208" width="120" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="80" y="224" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">x³ + x²</text>
<line x1="146" y1="224" x2="196" y2="224" stroke="#d9480f" stroke-width="1.5" marker-end="url(#aro)"/>
<rect x="202" y="208" width="130" height="32" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="267" y="224" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">x² + x + 1</text>
<rect x="20" y="252" width="120" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="80" y="268" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">x⁶ + 1</text>
<line x1="146" y1="268" x2="196" y2="268" stroke="#d9480f" stroke-width="1.5" marker-end="url(#aro)"/>
<rect x="202" y="252" width="130" height="32" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="267" y="268" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">x²</text>
<text x="170" y="316" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">（どれも右の 8 個のどれかになる）</text>
<rect x="395" y="46" width="350" height="276" rx="12" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="570" y="66" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">要素は 8 個だけ（次数 2 以下 ＝ 3 ビット）</text>
<rect x="410" y="84" width="150" height="48" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="485" y="101" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">0</text>
<text x="485" y="120" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">000</text>
<rect x="580" y="84" width="150" height="48" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="655" y="101" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">1</text>
<text x="655" y="120" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">001</text>
<rect x="410" y="142" width="150" height="48" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="485" y="159" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">x</text>
<text x="485" y="178" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">010</text>
<rect x="580" y="142" width="150" height="48" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="655" y="159" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">x + 1</text>
<text x="655" y="178" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">011</text>
<rect x="410" y="200" width="150" height="48" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="485" y="217" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">x²</text>
<text x="485" y="236" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">100</text>
<rect x="580" y="200" width="150" height="48" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="655" y="217" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">x² + 1</text>
<text x="655" y="236" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">101</text>
<rect x="410" y="258" width="150" height="48" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="485" y="275" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">x² + x</text>
<text x="485" y="294" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">110</text>
<rect x="580" y="258" width="150" height="48" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="655" y="275" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">x² + x + 1</text>
<text x="655" y="294" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">111</text>
<line x1="338" y1="180" x2="390" y2="180" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/></svg>