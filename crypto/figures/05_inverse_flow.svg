<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170" font-family="IPAGothic, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect width="760" height="170" fill="#fff"/>
<text x="380" y="22" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">逆元が必ずある理由（整数のときと同じ 3 段）</text>
<rect x="20" y="48" width="220" height="100" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="72" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">f が既約</text>
<text x="130" y="100" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">a ≠ 0, deg a &lt; m</text>
<text x="130" y="124" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">なら gcd(a, f) = 1</text>
<line x1="242" y1="98" x2="268" y2="98" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<rect x="270" y="48" width="220" height="100" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="380" y="72" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">拡張ユークリッド</text>
<text x="380" y="100" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">a·u + f·v = 1</text>
<text x="380" y="124" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">となる u, v がある</text>
<line x1="492" y1="98" x2="518" y2="98" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<rect x="520" y="48" width="220" height="100" rx="8" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="630" y="72" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">f で割った余りを取る</text>
<text x="630" y="100" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">f·v が消えて</text>
<text x="630" y="124" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">a·u ≡ 1 → u が逆元</text></svg>