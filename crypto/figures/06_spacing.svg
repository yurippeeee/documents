<text x="680" y="180" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">011</text>
<circle cx="600" cy="275" r="20" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
<text x="600" y="275" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">100</text>
<circle cx="750" cy="275" r="20" fill="#fff1e6" stroke="#d9480f" stroke-width="1.5"/>
<text x="750" y="275" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">101</text>
<circle cx="600" cy="125" r="20" fill="#fff1e6" stroke="#d9480f" stroke-width="1.5"/>
<text x="600" y="125" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">110</text>
<circle cx="750" cy="125" r="22" fill="#2563eb" stroke="#2563eb"/>
<text x="750" y="125" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" dominant-baseline="middle">111</text>
<text x="190" y="372" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="normal" dominant-baseline="middle">1 ビットの誤りで 000 が 001 に化けると、</text>
<text x="190" y="392" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="normal" dominant-baseline="middle">受信語も符号語なので誤りに気づけない</text>
<text x="640" y="372" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">1 ビットの誤りでは符号語にならない。青は 000 に、</text>
<text x="640" y="392" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">橙は 111 に近いので、近いほうに直せる（例 111 → 101 → 111）</text></svg>