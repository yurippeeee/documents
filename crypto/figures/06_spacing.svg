<circle cx="300" cy="125" r="20" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="300" y="125" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">111</text>
<text x="640" y="34" font-size="16" fill="#2b8a3e" text-anchor="middle" font-weight="bold" dominant-baseline="middle">遠い配置（良い例）</text>
<text x="640" y="56" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">符号語 000 と 111 は 3 ビットすべて違う</text>
<line x1="530" y1="330" x2="600" y2="275" stroke="#cbd5e1" stroke-width="2"/>
