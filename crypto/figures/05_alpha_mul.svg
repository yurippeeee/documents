<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="IPAGothic, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect width="760" height="440" fill="#fff"/>
<text x="380" y="22" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">掛け算 ＝ 円の上で指数を足す</text>
<line x1="309.6" y1="104.1" x2="347.6" y2="122.4" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arb)"/>
<text x="336.4472684892183" y="97.02082523835145" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal" dominant-baseline="middle">×α</text>
<line x1="397.1" y1="184.4" x2="406.4" y2="225.5" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arb)"/>
<text x="419.30565701801186" y="200.9219580961049" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal" dominant-baseline="middle">×α</text>
<line x1="388.8" y1="302.8" x2="362.5" y2="335.7" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arb)"/>
<text x="389.73384053187823" y="330.4845515728622" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal" dominant-baseline="middle">×α</text>
<line x1="291.1" y1="370.1" x2="248.9" y2="370.1" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arb)"/>
<text x="270.0" y="388.14533018536287" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal" dominant-baseline="middle">×α</text>
<line x1="177.5" y1="335.7" x2="151.2" y2="302.8" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arb)"/>
<text x="150.26615946812186" y="330.4845515728622" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal" dominant-baseline="middle">×α</text>
<line x1="133.6" y1="225.5" x2="142.9" y2="184.4" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arb)"/>
<text x="120.69434298198816" y="200.92195809610493" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal" dominant-baseline="middle">×α</text>
<line x1="192.4" y1="122.4" x2="230.4" y2="104.1" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arb)"/>
<text x="203.5527315107817" y="97.02082523835145" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal" dominant-baseline="middle">×α</text>
<circle cx="270.0" cy="85.0" r="40" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.8"/>
<text x="270.0" y="71.0" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">α⁰</text>
<text x="270.0" y="90.0" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">1</text>
<text x="270.0" y="106.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">001</text>
<circle cx="387.3" cy="141.5" r="40" fill="#fff1e6" stroke="#d9480f" stroke-width="1.8"/>
<text x="387.2747223702045" y="127.47652972118999" font-size="17" fill="#d9480f" text-anchor="middle" font-weight="bold" dominant-baseline="middle">α¹</text>
<text x="387.2747223702045" y="146.47652972119" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">α</text>
<text x="387.2747223702045" y="162.47652972119" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">010</text>
<circle cx="416.2" cy="268.4" r="40" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.8"/>
<text x="416.23918682727356" y="254.37814009344714" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">α²</text>
<text x="416.23918682727356" y="273.37814009344714" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">α²</text>
<text x="416.23918682727356" y="289.37814009344714" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">100</text>
<circle cx="335.1" cy="370.1" r="40" fill="#fff1e6" stroke="#d9480f" stroke-width="1.8"/>
<text x="335.08256086763373" y="356.14533018536287" font-size="17" fill="#d9480f" text-anchor="middle" font-weight="bold" dominant-baseline="middle">α³</text>
<text x="335.08256086763373" y="375.14533018536287" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">α + 1</text>
<text x="335.08256086763373" y="391.14533018536287" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">011</text>
<circle cx="204.9" cy="370.1" r="40" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.8"/>
<text x="204.9174391323663" y="356.14533018536287" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">α⁴</text>
<text x="204.9174391323663" y="375.14533018536287" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">α² + α</text>
<text x="204.9174391323663" y="391.14533018536287" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">110</text>
<circle cx="123.8" cy="268.4" r="40" fill="#fff1e6" stroke="#d9480f" stroke-width="1.8"/>
<text x="123.76081317272644" y="254.3781400934472" font-size="17" fill="#d9480f" text-anchor="middle" font-weight="bold" dominant-baseline="middle">α⁵</text>
<text x="123.76081317272644" y="273.3781400934472" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">α² + α + 1</text>
<text x="123.76081317272644" y="289.3781400934472" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">111</text>
<circle cx="152.7" cy="141.5" r="40" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.8"/>
<text x="152.72527762979553" y="127.47652972118999" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">α⁶</text>
<text x="152.72527762979553" y="146.47652972119" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal" dominant-baseline="middle">α² + 1</text>
<text x="152.72527762979553" y="162.47652972119" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">101</text>
<text x="270" y="229" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">α⁷ = α⁰ = 1</text>
<text x="270" y="249" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">で一周</text>
<circle cx="640" cy="380" r="30" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="640" y="374" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold" dominant-baseline="middle">0</text>
<text x="640" y="394" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">000</text>
<text x="640" y="338" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" dominant-baseline="middle">0 は巡回の外</text>
<text x="470" y="80" font-size="15" fill="#d9480f" text-anchor="start" font-weight="bold" dominant-baseline="middle">α³ · α⁵ = α⁸</text>
<text x="470" y="106" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal" dominant-baseline="middle">α³ から 5 つ進むと</text>
<text x="470" y="132" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal" dominant-baseline="middle">3 + 5 = 8 → 8 − 7 = 1</text>
<text x="470" y="158" font-size="15" fill="#d9480f" text-anchor="start" font-weight="bold" dominant-baseline="middle">= α¹ = α</text>
<text x="470" y="184" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal" dominant-baseline="middle"></text>
<text x="470" y="210" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal" dominant-baseline="middle">逆元: α³ の相手は</text>
<text x="470" y="236" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal" dominant-baseline="middle">あと 4 つ進んで 1 に</text>
<text x="470" y="262" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal" dominant-baseline="middle">戻る α⁴（3 + 4 = 7）</text></svg>